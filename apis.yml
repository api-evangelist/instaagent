name: InstaAgent
description: >-
  InstaAgent is a Y Combinator-backed AI marketing platform that turns a single
  campaign brief into hundreds of audience-specific creatives. It generates
  persona-, trend-, and format-grounded ad variants, distributes them across
  Meta, TikTok, and niche social accounts built for specific audiences, then
  tests which personas, hooks, formats, and channels drive performance and
  scales the winners into the next campaign. The company reports serving 500+
  clients across 10+ countries with 10x ad variants and 30%+ ROI improvement.
  InstaAgent operates a marketing product surface only and does not currently
  publish a public developer API, SDKs, or developer documentation; this profile
  captures its public identity and domain-security posture.
